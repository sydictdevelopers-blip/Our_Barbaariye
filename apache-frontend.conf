# Apache VirtualHost – React frontend at /frontend + API proxy at /api
# Place in /etc/apache2/sites-available/ and enable with a2ensite.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # ---------- React Frontend at /frontend ----------
    Alias /frontend /var/www/syd-frontend/dist

    <Directory /var/www/syd-frontend/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        # SPA: serve index.html for non-file routes (React Router)
        FallbackResource index.html
    </Directory>
    # ---------- END React Frontend ----------

    # ---------- Node.js API Proxy ----------
    ProxyPreserveHost On
    ProxyPass        "/api/" "http://127.0.0.1:3030/"
    ProxyPassReverse "/api/" "http://127.0.0.1:3030/"
    # ---------- END API Proxy ----------

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
